local_backend: true
publish_mode: editorial_workflow

backend:
  name: github
  repo: RobertLeeMorgan/aquaclear-v1
  branch: main
  site_domain: https://www.aquaclearwatermanagement.com/
  base_url: https://www.aquaclearwatermanagement.com/
  auth_endpoint: /api/auth
  squash_merges: true

media_library:
  name: uploadcare

collections:

  - name: "services"
    label: "Services"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    media_folder: "../../assets/images"
    public_folder: "../../assets/images"
    fields:
      - label: "SEO"
        name: "seo"
        widget: object
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "markdown" }
          - { label: "Image", name: "image", widget: "image", required: false }
      - label: "Content"
        name: "content"
        widget: list
        types:
          - label: "Hero"
            name: "hero"
            widget: object
            fields:
              - { label: "Type", name: "type", widget: "hidden", default: "hero" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "markdown", required: false }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Alt", name: "alt", widget: "string", required: false }
              - label: "Buttons"
                name: "buttons"
                widget: list
                required: false
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Href", name: "href", widget: "string", required: false }
          - label: "Page Header"
            name: "pageHeader"
            widget: object
            fields:
              - { label: "Type", name: "type", widget: "hidden", default: "pageHeader" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "markdown", required: false }
          - label: "Rich Text Section"
            name: "richTextSection"
            widget: object
            fields:
              - { label: "Type", name: "type", widget: "hidden", default: "richTextSection" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Content", name: "content", widget: "markdown" }
              - label: "Media"
                name: "media"
                widget: list
                required: false
                types:
                  - label: "Image"
                    name: "image"
                    widget: object
                    fields:
                      - { label: "Type", name: "type", widget: "hidden", default: "image" }
                      - { label: "Src", name: "src", widget: "image" }
                      - { label: "Alt", name: "alt", widget: "string" }
                  - label: "Video"
